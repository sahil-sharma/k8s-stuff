apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: test-cluster
nodes:
  - role: control-plane
    image: kindest/node:v1.34.0
    extraPortMappings:
      - containerPort: 32080
        hostPort: 80
        protocol: TCP
      - containerPort: 32443
        hostPort: 443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.34.0
    labels:
      workload: app
      tier: application
  - role: worker
    image: kindest/node:v1.34.0
    labels:
      workload: app
      tier: application
