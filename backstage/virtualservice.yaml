apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: virtualservice
  namespace: backstage
spec:
  hosts:
    - idp.local.io
  gateways:
    - gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: backstage.backstage.svc.cluster.local
            port:
              number: 7007
