apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: go-welcome-app-secret-store
  namespace: go-welcome-app
spec:
  provider:
    vault:
      server: "https://secrets.local.io"
      path: "apps"
      version: "v2"
      caProvider:
        type: "ConfigMap"
        name: "local-io-bundle"
        key: "ca-bundle.crt"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "go-welcome-app-role"
          serviceAccountRef:
            name: "go-welcome-app-service-account"
