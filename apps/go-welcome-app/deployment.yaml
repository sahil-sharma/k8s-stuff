apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-welcome-app
  namespace: go-welcome-app
  labels:
    app.kubernetes.io/name: go-welcome-app
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: go-welcome-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-welcome-app
    spec:
      serviceAccountName: go-welcome-app-service-account
      containers:
        - name: go-welcome-app
          image: sahilwork/go-welcome-app:e9f8756
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          envFrom:
            - secretRef:
                name: go-welcome-app-secret
