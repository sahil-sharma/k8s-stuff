apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: go-welcome-app-external-secret
  namespace: go-welcome-app
spec:
  refreshInterval: 10s
  secretStoreRef:
    name: go-welcome-app-secret-store
    kind: SecretStore
  target:
    name: go-welcome-app-secret
    creationPolicy: Owner
  data:
    - secretKey: APP_USERNAME
      remoteRef:
        key: go-welcome-app
        property: APP_USERNAME
    - secretKey: APP_PASSWORD
      remoteRef:
        key: go-welcome-app
        property: APP_PASSWORD
