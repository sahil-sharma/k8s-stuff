apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-welcome-app
  namespace: argo-cd
spec:
  project: default
  destination:
    namespace: go-welcome-app
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/sahil-sharma/k8s-stuff
    targetRevision: main
    path: apps/go-welcome-app
  revisionHistoryLimit: 2
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
