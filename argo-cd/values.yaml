crds:
  install: true

global:
  domain: cd.local.io

redis-ha:
  enabled: false

commitServer:
  enabled: true

redis:
  exporter:
    enabled: true
  metrics:
    enabled: true
    service:
      clusterIP: ""

controller:
  replicas: 1
  metrics:
    enabled: true

dex:
  enabled: false

server:
  metrics:
    enabled: true
  replicas: 1
  extensions:
    enabled: false
    extensionList:
      - name: extension-gitops-promoter
        env:
          - name: EXTENSION_NAME
            value: gitops-promoter
          - name: EXTENSION_URL
            value: https://github.com/argoproj-labs/gitops-promoter/releases/download/v0.37.0/gitops-promoter-argocd-extension.tar.gz
          - name: EXTENSION_CHECKSUM_URL
            value: https://github.com/argoproj-labs/gitops-promoter/releases/download/v0.37.0/gitops-promoter_0.37.0_checksums.txt
      - name: rollout-extension
        env:
          - name: EXTENSION_URL
            value: https://github.com/argoproj-labs/rollout-extension/releases/download/v0.3.4/extension.tar
  deploymentAnnotations:
    secret.reloader.stakater.com/reload: "argo-cd-sso-secret"

  ingress:
    enabled: false

  extraArgs:
    - --insecure

repoServer:
  metrics:
    enabled: true
  replicas: 1
  # envFrom:
  #   - secretRef:
  #       name:  git-ssh-creds       # Private Repo secret name

applicationSet:
  replicas: 1
  metrics:
    enabled: true

notifications:
  metrics:
    enabled: true

configs:
  rbac:
    create: true
    # scopes: "[groups]"
    policy.default: role:readonly
    policy.csv: |
      # === Role Bindings ===
      p, role:readonly, extensions, invoke, metrics, allow

      g, devops, role:admin
      g, engineering, role:eng
      g, data, role:readonly

      # === Role Definitions ===
      # Admin role - full access
      p, role:admin, *, *, */*, allow

      p, role:backstage, applications, get, */*, allow
      p, role:backstage, applications, list, */*, allow
      p, role:backstage, logs, get, */*, allow
      g, backstage, role:backstage

      # Engineer role - get/list/create/update but NOT delete
      p, role:eng, applications, get, */*, allow
      p, role:eng, applications, list, */*, allow
      p, role:eng, applications, create, */*, allow
      p, role:eng, applications, update, */*, allow
      p, role:eng, applications, sync, */*, allow
      p, role:eng, projects, get, */*, allow
      p, role:eng, projects, list, */*, allow
      p, role:eng, repositories, get, */*, allow
      p, role:eng, repositories, list, */*, allow

      # ReadOnly role - just list/get
      p, role:readonly, *, get, */*, allow
      p, role:readonly, *, list, */*, allow

  secret:
    extra:
      accounts.backstage.password: $2a$10$lMua1GwSAJSgv6wXPUIR6OCzrnCf0.cT60DVquY4GJBsEhJ3DBRTq

  params:
    hydrator.enabled: "true"
    proxy.extension: "true"

  cm:
    timeout.reconciliation: 30s
    admin.enabled: false
    url: https://cd.local.io
    accounts.backstage: login
    oidc.config: |
      name: SSO
      issuer: https://sso.local.io/realms/platform
      clientID: $argo-cd-sso-secret:client-id
      clientSecret: $argo-cd-sso-secret:client-secret
      requestedScopes: ["openid", "profile", "email", "groups"]
      refreshTokenThreshold: 1m
      logoutURL: https://sso.local.io/realms/platform/protocol/openid-connect/logout
    oidc.tls.insecure.skip.verify: "true"
  repositories:
    pgadmin:
      type: helm
      name: pgadmin
      url: https://helm.runix.net
      project: default
    reloader:
      type: helm
      url: https://stakater.github.io/stakater-charts
      name: reloader
      project: default
    bitnami:
      type: helm
      url: https://charts.bitnami.com/bitnami
      name: bitnami
      project: default
    external-secrets:
      type: helm
      name: eso
      url: https://charts.external-secrets.io
      project: default
    ingress-nginx:
      type: helm
      name: ingress-nginx
      url: https://kubernetes.github.io/ingress-nginx
      project: default
    grafana:
      type: helm
      name: grafana
      url: https://grafana.github.io/helm-charts
      project: default
    prometheus:
      type: helm
      name: prometheus
      url: https://prometheus-community.github.io/helm-charts
      project: default
    otel-collector:
      type: helm
      name: otel-collector
      url: https://open-telemetry.github.io/opentelemetry-helm-charts
      project: default
    go-welcome-app:
      type: git
      url: https://github.com/sahil-sharma/go-welcome-app.git
      name: go-welcome-app
      project: default
