apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: dev

replicas:
  - name: welcome-app-deployment
    count: 1

configMapGenerator:
  - name: welcome-app-config
    behavior: merge
    literals:
      - APP_ENV_NAME="development"

patches:
  - target:
      kind: VirtualService
      name: welcome-app
    patch: |-
      - op: replace
        path: /spec/hosts/0
        value: dev.welcome.local.io
