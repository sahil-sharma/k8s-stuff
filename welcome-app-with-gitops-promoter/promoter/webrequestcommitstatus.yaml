apiVersion: promoter.argoproj.io/v1alpha1
kind: WebRequestCommitStatus
metadata:
  name: http-ok
  namespace: promoter-system
spec:
  promotionStrategyRef:
    name: welcome-app
  key: http-ok
  reportOn: active
  descriptionTemplate: "HTTP check for {{ .Branch }}: {{ .Phase }}"
  httpRequest:
    urlTemplate: >-
      {{- if eq .Branch "environment/dev" -}}http://welcome-app-service.dev.svc.cluster.local:8080
      {{- else if eq .Branch "environment/staging" -}}http://welcome-app-service.staging.svc.cluster.local:8080
      {{- else -}}http://welcome-app-service.prod.svc.cluster.local:8080{{- end -}}
    methodTemplate: GET
    timeout: 10s
  success:
    when:
      expression: 'Response != nil ? Response.StatusCode == 200 : Phase == "success"'
  mode:
    polling:
      interval: 30s
