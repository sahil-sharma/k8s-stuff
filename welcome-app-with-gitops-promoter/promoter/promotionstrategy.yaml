apiVersion: promoter.argoproj.io/v1alpha1
kind: PromotionStrategy
metadata:
  name: welcome-app
  namespace: promoter-system
spec:
  # Global Pull Request configuration for manual promotions
  pullRequest:
    title: "chore(release): promote welcome-app to production"
    body: "Automated PR generated by GitOps Promoter."
    reviewers:
      - "sahil-sharma"
    #teamReviewers:
    #  - "release-approvers-team"
  gitRepositoryRef:
    name: k8s-stuff
  activeCommitStatuses:
    - key: argocd-health
    - key: http-ok
  environments:
    - branch: environment/dev
      autoMerge: true

    - branch: environment/staging
      autoMerge: true

    - branch: environment/prod
      autoMerge: false
