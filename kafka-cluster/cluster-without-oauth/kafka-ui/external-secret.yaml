apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-kafka-reader
  namespace: kafka-ui
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cluster-1-secret-store
  namespace: kafka-ui
spec:
  provider:
    kubernetes:
      remoteNamespace: cluster-1
      auth:
        serviceAccount:
          name: eso-kafka-reader
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-1-kafka-ui-secret
  namespace: kafka-ui
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: cluster-1-secret-store
    kind: SecretStore
  target:
    name: cluster-1-kafka-ui-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: kafka-ui
        property: password
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cluster-2-secret-store
  namespace: kafka-ui
spec:
  provider:
    kubernetes:
      remoteNamespace: cluster-2
      auth:
        serviceAccount:
          name: eso-kafka-reader
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-2-kafka-ui-secret
  namespace: kafka-ui
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: cluster-2-secret-store
    kind: SecretStore
  target:
    name: cluster-2-kafka-ui-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: kafka-ui
        property: password
---
