apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: backstage-db
  namespace: backstage-pg
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: backstage-db
  podMetricsEndpoints:
    - port: metrics
      scheme: http
  namespaceSelector:
    matchNames:
      - backstage-pg
