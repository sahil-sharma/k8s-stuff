apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backstage-pg-alerts
  namespace: backstage-pg
  labels:
    release: monitoring
spec:
  groups:
    - name: backstage-pg
      rules:
        - alert: BackstagePGHighConnections
          expr: |
            sum(cnpg_backends_total{namespace="backstage-pg"}) > 1
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "High number of PostgreSQL connections"
            description: "Backstage DB has {{ $value }} connections, threshold is 1."
