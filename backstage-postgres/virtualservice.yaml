apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: virtualservice
  namespace: backstage-pg
spec:
  hosts:
    - "*"
  gateways:
    - gateway
  tcp:
    - match:
        - port: 5434
      route:
        - destination:
            host: backstage-db-rw.backstage-pg.svc.cluster.local
            port:
              number: 5432
